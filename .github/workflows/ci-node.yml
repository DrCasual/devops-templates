# Reusable: install a Node project with npm ci, then typecheck, lint, test and build.
name: ci-node

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      working-directory:
        type: string
        default: "."
      typecheck-command:
        type: string
        default: npm run typecheck --if-present
      lint-command:
        type: string
        default: npm run lint --if-present
      test-command:
        type: string
        default: npm test --if-present
      build-command:
        type: string
        default: npm run build --if-present

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        if: inputs.typecheck-command != ''
        run: ${{ inputs.typecheck-command }}
      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}
      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
