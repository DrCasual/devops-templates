# Reusable: give the image that was built for this commit (sha-<7>) a release tag,
# without rebuilding. Used when a version tag such as v1.4.0 is pushed.
# If no image exists for the commit yet, it is built and pushed first.
name: promote-image

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name without tag. Default ghcr.io/<owner>/<repo> in lowercase.
        type: string
        default: ""
      tags:
        description: Tags to add, one per line. Default the git tag name plus "latest".
        type: string
        default: ""
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      build-args:
        type: string
        default: ""
    outputs:
      image:
        description: Image reference with the release tag.
        value: ${{ jobs.promote.outputs.image }}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.release }}
    steps:
      - name: Names and tags
        id: name
        env:
          NAME: ${{ inputs.image-name }}
          TAGS: ${{ inputs.tags }}
        run: |
          name="${NAME:-ghcr.io/${GITHUB_REPOSITORY,,}}"
          read -r -a tags <<< "$(tr '\n' ' ' <<< "${TAGS:-$GITHUB_REF_NAME latest}")"
          {
            echo "name=$name"
            echo "source=$name:sha-${GITHUB_SHA::7}"
            echo "release=$name:${tags[0]}"
            echo "tags=${tags[*]}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Does an image exist for this commit?
        id: exists
        env:
          SOURCE: ${{ steps.name.outputs.source }}
        run: |
          if docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No image $SOURCE yet; building it."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.exists.outputs.found != 'true'

      - name: Build and push the missing image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.name.outputs.source }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: Add release tags
        env:
          NAME: ${{ steps.name.outputs.name }}
          SOURCE: ${{ steps.name.outputs.source }}
          TAGS: ${{ steps.name.outputs.tags }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$NAME:$tag"); done
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          echo "Promoted $SOURCE to: $TAGS"
