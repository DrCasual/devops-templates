# Reusable: build the Docker image, optionally smoke-test it, optionally push it to GHCR.
# The image is always tagged sha-<7 chars of the commit>; that tag is what staging
# runs and what a release later promotes, so production gets exactly the tested image.
name: docker-image

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name without tag. Default ghcr.io/<owner>/<repo> in lowercase.
        type: string
        default: ""
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      build-args:
        description: Extra build args, one KEY=value per line. APP_COMMIT is always passed.
        type: string
        default: ""
      smoke-command:
        description: Command run after the build with IMAGE set to the built image. Empty to skip.
        type: string
        default: ""
      push:
        type: boolean
        default: false
      extra-tags:
        description: Extra tags to push, one per line (for example "main").
        type: string
        default: ""
    outputs:
      image:
        description: Image reference with the sha tag.
        value: ${{ jobs.image.outputs.image }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        env:
          NAME: ${{ inputs.image-name }}
        run: |
          name="${NAME:-ghcr.io/${GITHUB_REPOSITORY,,}}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=$name:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          tags: ${{ steps.name.outputs.image }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: inputs.smoke-command != ''
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: ${{ inputs.smoke-command }}

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: inputs.push
        env:
          NAME: ${{ steps.name.outputs.name }}
          IMAGE: ${{ steps.name.outputs.image }}
          EXTRA_TAGS: ${{ inputs.extra-tags }}
        run: |
          docker push "$IMAGE"
          for tag in $EXTRA_TAGS; do
            docker tag "$IMAGE" "$NAME:$tag"
            docker push "$NAME:$tag"
          done
