# Reusable: deploy an image with Docker Compose on a self-hosted runner
# (backup → pull → up → health check → automatic rollback).
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Name used in logs and for the concurrency lock, for example staging or production.
        type: string
        required: true
      image:
        description: Full image reference to deploy.
        type: string
        required: true
      runs-on:
        description: JSON list of runner labels.
        type: string
        default: '["self-hosted", "linux"]'
      deploy-dir:
        type: string
        required: true
      compose-file:
        type: string
        default: deploy/compose.yaml
      service:
        type: string
        default: app
      health-url:
        type: string
        required: true
      health-expect:
        description: Text the health response must contain. Default the commit sha.
        type: string
        default: ""
      health-timeout:
        type: string
        default: "120"
      backup-command:
        type: string
        default: ""
      keep-backups:
        type: string
        default: "14"
      url:
        description: Public URL, shown in the run summary.
        type: string
        default: ""
      latest-only:
        description: >-
          Branch name (e.g. main). If set, the deploy is skipped when that branch has already moved past this
          commit, so two quick merges never end with the older one deployed last. Leave empty for releases.
        type: string
        default: ""

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Is this still the newest commit?
        id: latest
        if: inputs.latest-only != ''
        env:
          BRANCH: ${{ inputs.latest-only }}
        run: |
          head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$BRANCH has moved on to ${head::7}; its own run deploys that. Skipping ${GITHUB_SHA::7}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: steps.latest.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: DrCasual/devops-templates/actions/compose-deploy@v1
        if: steps.latest.outputs.skip != 'true'
        with:
          deploy-dir: ${{ inputs.deploy-dir }}
          image: ${{ inputs.image }}
          compose-file: ${{ inputs.compose-file }}
          service: ${{ inputs.service }}
          health-url: ${{ inputs.health-url }}
          health-expect: ${{ inputs.health-expect || github.sha }}
          health-timeout: ${{ inputs.health-timeout }}
          backup-command: ${{ inputs.backup-command }}
          keep-backups: ${{ inputs.keep-backups }}

      - name: Summary
        if: steps.latest.outputs.skip != 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          URL: ${{ inputs.url }}
        run: |
          {
            echo "### Deployed to $ENVIRONMENT"
            echo "- Image: \`$IMAGE\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            [ -n "$URL" ] && echo "- Live: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
